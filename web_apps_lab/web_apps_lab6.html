<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-4-HW</title>
	<style>
		body{border:1px solid gray;}
	</style>
</head>
<body>
<h1>My Favorites</h1>
<h2>My Favorite Colors</h2>

<ol id="colorsList">
	
</ol>

<h2>My Favorite Foods</h2>

<ol id="foodsList">
	
</ol>

<h2>My Favorite Links</h2>

<ol id="linksList">
	
</ol>

<script>
"use strict";
let colors = ["red","yellow","blue","white","black"];
let foods = ["pho","hamburger","tacos","pizza","pasta"]; // add some foods

// Optional - can you figure out how to pull both the key AND the value
// from the `links` object literal?
let links = {
		"RIT": "http://www.rit.edu",
		"RWAG" : "https://www.facebook.com/RWAGclub",
		"New Media Club" : "http://newmediaclub.cias.rit.edu",
        "Greece Gladiators Robotics": "https://www.gladiatorsrobotics.org/home",
        "YouTube": "https://www.youtube.com"
	}

// 1. Loop through the colors array and append list items to #colorsList using a classic for loop
let colorsList = document.getElementById("colorsList");
for (let i = 0; i < colors.length; i++) {
	let listItem = document.createElement("li");
	listItem.textContent = colors[i];
	colorsList.appendChild(listItem);
}

// 2. Loop through the foods array and append list items to #foodsList using a for...of loop
let foodsList = document.getElementById("foodsList");
for (let food of foods) {
	let listItem = document.createElement("li");
	listItem.textContent = food;
	foodsList.appendChild(listItem);
}

// 3. Loop through the links object and append functioning links to #linksList using a for...in loop
let linksList = document.getElementById("linksList");
for (let siteName in links) {
	let listItem = document.createElement("li");
	let linkElement = document.createElement("a");
	linkElement.href = links[siteName];
	linkElement.textContent = siteName;
	linkElement.target = "_blank";  // Open link in a new tab
	listItem.appendChild(linkElement);
	linksList.appendChild(listItem);
}


</script>
</body>
</html>
